# config/tmux/tmux.conf - tmux 配置（经 ~/.tmux.conf 转发加载）
# 每行配置附注释，便于很久以后回顾。

# --- 基础 ---
set -g default-terminal "tmux-256color"           # 终端类型，支持 256 色
set -ag terminal-overrides ",xterm-*:Tc"          # xterm 系列启用真彩色（Tc）
set -ag terminal-overrides ",alacritty*:Tc"       # Alacritty 真彩色
set -ag terminal-overrides ",foot*:Tc"            # foot 终端真彩色
set -ag terminal-overrides ",kitty*:Tc"           # Kitty 真彩色
set -ag terminal-overrides ",wezterm*:Tc"         # WezTerm 真彩色
set -g history-limit 50000                        # 回滚历史行数上限
set -g mouse on                                   # 启用鼠标（滚轮/选 pane/调整大小）
set -g base-index 1                               # 窗口编号从 1 开始（0 太靠左）
setw -g pane-base-index 1                         # 窗格编号也从 1 开始
set -g renumber-windows on                        # 关闭窗口后自动重编号，不留空隙
set -g escape-time 10                             # 缩短 Esc 键延迟（vim 友好，默认 500ms 太卡）
set -g focus-events on                            # 向内传递焦点事件（nvim autoread 等需要）
set -g set-clipboard on                           # OSC52 剪贴板（SSH 下也能复制到本地）
set -g detach-on-destroy off                      # 关闭最后一个窗格不 detach，回到 shell

# --- 前缀键：保持默认 C-b（若想改 C-a，取消下面注释）---
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# --- 重新加载配置 ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux 配置已重载"  # prefix r 重载

# --- 分屏（| 竖分，- 横分），继承当前路径 ---
bind | split-window -h -c "#{pane_current_path}"  # prefix | 左右分屏
bind - split-window -v -c "#{pane_current_path}"  # prefix - 上下分屏
unbind '"'                                        # 解绑默认的双引号横分
unbind %                                          # 解绑默认的百分号竖分
bind c new-window -c "#{pane_current_path}"       # 新建窗口也继承当前路径

# --- vi 模式（复制模式用 hjkl）---
setw -g mode-keys vi                              # 复制模式键位改为 vi 风格
bind -T copy-mode-vi v send -X begin-selection    # v 开始选中
bind -T copy-mode-vi V send -X select-line        # V 选中整行
bind -T copy-mode-vi C-v send -X rectangle-toggle # C-v 矩形（列）选择
# 跨平台复制：macOS pbcopy / Wayland wl-copy / X11 xclip,xsel / 兜底 true（静默失败）
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -sel clip 2>/dev/null || xsel -bi 2>/dev/null || true"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -sel clip 2>/dev/null || xsel -bi 2>/dev/null || true"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -sel clip 2>/dev/null || xsel -bi 2>/dev/null || true"

# --- Alt+方向键 跨 pane 移动（无需前缀）---
bind -n M-Left select-pane -L                     # Alt+左 跳左 pane
bind -n M-Right select-pane -R                    # Alt+右 跳右 pane
bind -n M-Up select-pane -U                       # Alt+上 跳上 pane
bind -n M-Down select-pane -D                     # Alt+下 跳下 pane

# --- 状态栏（Catppuccin Mocha 配色，纯文本无 powerline/nerdfont 字形）---
set -g status-position bottom                     # 状态栏在底部
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"       # 状态栏底色/前景色
set -g status-left "#[fg=#cba6f7,bold] #S "       # 左侧：会话名（紫色加粗）
set -g status-right "#[fg=#a6e3a1]%Y-%m-%d #[fg=#f9e2af]%H:%M " # 右侧：日期（绿）+ 时间（黄）
set -g status-left-length 30                      # 左侧最大长度
set -g status-right-length 50                     # 右侧最大长度
setw -g window-status-style "fg=#a6adc8"          # 非当前窗口灰色
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold" # 当前窗口蓝底加粗
setw -g window-status-current-format " #I:#W "    # 当前窗口格式：序号:名称
setw -g window-status-format " #I:#W "            # 其它窗口格式：序号:名称
setw -g window-status-separator " "               # 窗口间分隔符
set -g pane-border-style "fg=#313244"             # 非活动窗格边框暗灰
set -g pane-active-border-style "fg=#89b4fa"     # 活动窗格边框蓝色
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold" # 提示消息样式
setw -g clock-mode-colour "#89b4fa"               # 时钟模式颜色
setw -g mode-style "bg=#45475a,fg=#cdd6f4,bold"   # 复制模式选中样式

# --- 插件（tpm，tmux 插件管理器）---
set -g @plugin "tmux-plugins/tpm"                 # tpm 自身
set -g @plugin "tmux-plugins/tmux-sensible"       # 一组合理默认值
# set -g @plugin "tmux-plugins/tmux-resurrect"    # （可选）会话持久化
# 仅当 tpm 已安装时才加载，避免首装前报错
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" "run ~/.tmux/plugins/tpm/tpm"
