# config/tmux/tmux.conf - tmux 配置（经 ~/.tmux.conf 转发加载）

# --- 基础 ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-*:Tc"      # true color
set -g history-limit 50000
set -g mouse on
set -g base-index 1                            # 窗口从 1 开始
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10                          # 缩短 Esc 延迟（vim 友好）
set -g focus-events on

# --- 前缀键：保持默认 C-b（改 C-a 见下方注释）---
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# --- 重新加载 ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux 配置已重载"

# --- 分屏（| 竖分，- 横分），继承当前路径 ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# --- vi 模式 ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || clipcopy 2>/dev/null || true"

# --- Alt+方向 跨 pane ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- 状态栏（精简）---
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] #S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M "
set -g status-right-length 50
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# --- 插件（tpm）---
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
# set -g @plugin "tmux-plugins/tmux-resurrect"
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" "run ~/.tmux/plugins/tpm/tpm"
